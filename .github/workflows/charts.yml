# Rebuilds the animated SVG charts in assets/ (contribution trend uses live data).
name: Update profile charts

on:
  schedule:
    - cron: "30 0 * * *"   # daily, 00:30 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/build_charts.py"]

permissions:
  contents: write

jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_charts.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "Update profile charts" && git push)
