# Put this file in the Ahadmoen/Ahadmoen repo at: .github/workflows/snake.yml
# It draws the animated "snake eats your contribution graph" SVG once a day
# and pushes it to an "output" branch, which the profile README displays.
name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # every day at midnight UTC
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0f2027&color_dots=#ebedf0,#c5dde6,#8fbccd,#4f93ad,#2c5364
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7fb8cc&color_dots=#0d1117,#0f2a36,#1d4a5c,#2c6f88,#4f93ad

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
